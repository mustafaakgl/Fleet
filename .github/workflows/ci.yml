name: CI

on:
  push:
    branches: [main, master, develop, faz-a, 'feature/**']
  pull_request:
    branches: [main, master, develop, faz-a, 'feature/**']

jobs:
  backend-security-auth:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22']
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fleet
          POSTGRES_PASSWORD: fleet123
          POSTGRES_DB: fleet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fleet -d fleet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://fleet:fleet123@localhost:5432/fleet
      JWT_SECRET: ci_test_jwt_secret_minimum_32_chars_long
      NODE_ENV: test
      REFRESH_TOKEN_TTL_DAYS: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run build
      - run: npm run test
      - name: Security audit (non-blocking)
        continue-on-error: true
        run: npm audit --audit-level=high

  tenant-isolation:
    runs-on: ubuntu-latest
    needs: [backend-security-auth]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fleet
          POSTGRES_PASSWORD: fleet123
          POSTGRES_DB: fleet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fleet -d fleet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://fleet:fleet123@localhost:5432/fleet
      JWT_SECRET: ci_test_jwt_secret_minimum_32_chars_long
      NODE_ENV: test
      REFRESH_TOKEN_TTL_DAYS: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npx ts-node --transpile-only scripts/tenant-isolation-check.ts
      - name: Load test script present
        run: test -f ../scripts/load/k6-smoke.js

  # Judges the generated e-invoices by the official reference implementations rather than
  # by our own reading of the specs. Separate from the unit-test job because it needs a
  # JDK and downloads ~78 MB of validator jars.
  einvoice-validation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Cache validator jars
        uses: actions/cache@v4
        with:
          path: backend/tmp/einvoice-tools
          # Pinned tool versions live in the script, so its hash is the cache key.
          key: einvoice-tools-${{ hashFiles('backend/scripts/validate-einvoice.mjs') }}
      - name: Generate samples and validate against Mustang + KoSIT
        run: npm run validate:einvoice -- --expect-valid
      - name: Upload validator reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: einvoice-validation-reports
          path: |
            backend/tmp/einvoice-reports
            backend/tmp/einvoice-samples
          retention-days: 14

  frontend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22']
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Security audit (non-blocking)
        continue-on-error: true
        run: npm audit --audit-level=high

  mobile-typecheck:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22']
    defaults:
      run:
        working-directory: mobile-driver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: mobile-driver/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
